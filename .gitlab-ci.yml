# OpenTrust CI. The toolchain (version, components, embedded targets) comes
# from rust-toolchain.toml; rustup in the image installs it on first use.
image: "rust:1.95"

stages:
  - check
  - test
  - audit

variables:
  # The OpenThread submodule is only needed for tools/openthread-sys, which
  # is not part of the default workspace members.
  GIT_SUBMODULE_STRATEGY: none
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cargo-home/registry/
    - target/

fmt:
  stage: check
  script:
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - cargo clippy --all-targets -- -D warnings
    - cargo clippy --all-targets --features opentrust-core/log,opentrust-core/ecjpake -- -D warnings

doc:
  stage: check
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    - cargo doc --no-deps --workspace --exclude openthread-sys

embedded:
  stage: check
  parallel:
    matrix:
      - ALIAS: [check-nrf52, check-nrf54, check-esp32c6]
  script:
    - cargo $ALIAS
    # defmt must be enabled in every crate that logs (defmt macros expand to
    # `::defmt` paths in the caller), so enable it workspace-wide.
    - DEFMT=$(ls crates | grep -v opentrust-sim | sed 's|$|/defmt|' | paste -sd, -)
    - cargo $ALIAS --features "$DEFMT,opentrust-core/ecjpake"

test:
  stage: test
  script:
    - cargo test --verbose
    - cargo test -p opentrust-core --features ecjpake

audit:
  stage: audit
  script:
    - cargo install --locked cargo-audit
    - cargo audit
  allow_failure: true
