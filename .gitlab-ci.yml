image: "registry.gitlab.com/markushx/docker-rust:latest"

stages:
  - build
  - test 
  - lint
  - format
  - dependency_scanning
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CARGO_HOME: $CI_PROJECT_DIR/cargo

cache:
    key: "$CI_JOB_NAME"
    untracked: true
    paths:
    - $CI_PROJECT_DIR/.cargo/
    - target/

build:
  stage: build
  script:
    # currently there is a test in openthread-sys, but that fails because
    # the platform adaptation is not included in openthread-sys
    - cargo build --workspace --verbose
    - ls -la target/
  artifacts:
    paths:
      - target/
    expire_in: 1 week

test:
  stage: test
  script:
    - cargo test --workspace --verbose
  artifacts:
    paths:
      - target/
    expire_in: 1 week

lint:
  stage: lint
  script:
    - cargo clippy --workspace -- -D warnings
  allow_failure: true

format:
  stage: format
  script:
    - cargo fmt -- --check
  allow_failure: true

dependency_scanning:sys:
  stage: dependency_scanning
  script:
    - cargo audit

