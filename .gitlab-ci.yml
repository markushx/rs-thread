image: "rust:latest"

stages:
  - build
  - test 
  - lint
  - format
  - dependency_scanning
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: recursive

before_script:
  # Install a C compiler, cmake and git into the container.
  - apt-get update -yqq
  - apt-get install -yqq --no-install-recommends build-essential
  - apt-get install -yqq --no-install-recommends llvm-dev libclang-dev clang
  # more cargo tools
  - rustup component add clippy
  - rustup component add rustfmt
  # Print version info for debugging
  - rustc --version && cargo --version

build:sys:
  stage: build
  script:
    # currently there is a test in openthread-sys, but that fails because
    # the platform adaptation is not included in openthread-sys
    - cd openthread-sys
    - cargo build --verbose
    - ls -la target/
  artifacts:
    paths:
      - target/*

