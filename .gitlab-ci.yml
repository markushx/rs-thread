image: "registry.gitlab.com/markushx/docker-rust:add-tools"

stages:
  - build
  - test 
  - lint
  - format
  - dependency_scanning
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CARGO_HOME: $CI_PROJECT_DIR/cargo

cache:
    key: "$CI_JOB_NAME"
    untracked: true
    paths:
    - $CI_PROJECT_DIR/.cargo/
    - target/

#before_script:
#  - apt-get install -yqq --no-install-recommends kcov

build:sys:
  stage: build
  script:
    # currently there is a test in openthread-sys, but that fails because
    # the platform adaptation is not included in openthread-sys
    - cd openthread-sys
    - cargo build --verbose
    - ls -la target/
  artifacts:
    paths:
      - openthread-sys/target/
    expire_in: 1 week

# build:rust:
#   stage: build
#   script:
#     - cd openthread-rust
#     - cargo build --verbose
#     - ls -la target/
#   artifacts:
#     paths:
#       - target/*

test:sys:
  stage: test
  script:
    - cd openthread-sys
    - cargo test --verbose
  artifacts:
    paths:
      - openthread-sys/target/
    expire_in: 1 week

# test:rust:
#   stage: test
#   script:
#     # currently there is no test in openthread-rust
#     # cargo run currently fails because the platform adaptation is returning
#     # otError_OT_ERROR_NOT_IMPLEMENTED for several functions
#     - cd openthread-rust
#     - cargo test --verbose

lint:sys:
  stage: lint
  script:
    - cd openthread-sys
    - cargo clippy -- -D warnings
  allow_failure: true

# lint:rust:
#   stage: lint
#   script:
#     - cd openthread-rust
#     - cargo clippy -- -D warnings

format:sys:
  stage: format
  script:
    - cd openthread-sys
    - cargo fmt -- --check
  allow_failure: true

# format:rust:
#   stage: format
#   script:
#     - cd openthread-rust
#     - cargo fmt -- --check

dependency_scanning:sys:
  stage: dependency_scanning
  script:
    - cd openthread-sys
    - cargo audit

