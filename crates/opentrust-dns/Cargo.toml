[package]
name = "opentrust-dns"
description = "DNS codec, DNS / DNS-SD client and SRP client (RFC 9665) for OpenTrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["srp-client", "dns-client"]
# The SRP client (`srp::SrpClient`; OT `OPENTHREAD_CONFIG_SRP_CLIENT_ENABLE`).
srp-client = []
# The DNS / DNS-SD client (`client`; OT `OPENTHREAD_CONFIG_DNS_CLIENT_ENABLE`).
dns-client = []
defmt = ["dep:defmt", "opentrust-core/defmt", "heapless/defmt"]
log = ["dep:log", "opentrust-core/log"]
# The SRP server (`srp::server`).
srp-server = []

[dependencies]
opentrust-core = { workspace = true }
rand_core = { workspace = true }
heapless = { workspace = true }
zeroize = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
opentrust-core = { workspace = true, features = ["ecdsa", "soft-crypto"] }
p256 = { workspace = true, features = ["ecdsa"] }
sha2 = { workspace = true }

[lints]
workspace = true
