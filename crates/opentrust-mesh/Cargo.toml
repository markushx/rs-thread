[package]
name = "opentrust-mesh"
description = "Thread mesh routing, router IDs, child table and Network Data for OpenTrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# Router-only code: leader / router side of the TMF exchanges, routing and
# forwarding of other nodes' traffic, indirect queues for sleepy children.
default = ["ftd"]
ftd = ["opentrust-mle/ftd"]
# Expose the multi-node test simulator (`sim`) to dependent crates' tests.
test-support = ["ftd", "opentrust-mle/test-support", "dep:opentrust-platform"]
defmt = ["dep:defmt", "opentrust-core/defmt", "opentrust-mle/defmt", "opentrust-net/defmt", "opentrust-coap/defmt", "opentrust-lowpan/defmt", "opentrust-mac/defmt"]
log = ["dep:log", "opentrust-core/log", "opentrust-mle/log", "opentrust-net/log", "opentrust-coap/log", "opentrust-lowpan/log", "opentrust-mac/log"]

[dependencies]
opentrust-core = { workspace = true }
opentrust-mle = { workspace = true }
opentrust-net = { workspace = true }
opentrust-coap = { workspace = true }
opentrust-lowpan = { workspace = true }
opentrust-mac = { workspace = true }
heapless = { workspace = true }
rand_core = { workspace = true }
opentrust-platform = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
opentrust-mle = { workspace = true, features = ["test-support"] }
opentrust-platform = { workspace = true }

[lints]
workspace = true
