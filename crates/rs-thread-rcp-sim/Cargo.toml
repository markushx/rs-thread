[package]
name = "rs-thread-rcp-sim"
description = "OpenThread-compatible simulation RCP: OpenTrust radio over HDLC/Spinel on stdio and OpenThread's simulation radio protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish = false

[[bin]]
name = "rs-thread-rcp-sim"
path = "src/main.rs"

[dependencies]
rs-thread-core = { workspace = true }
rs-thread-platform = { workspace = true }
rs-thread-mac = { workspace = true }
rs-thread-ncp = { workspace = true }
socket2 = { version = "0.6", features = ["all"] }

[lints]
workspace = true
