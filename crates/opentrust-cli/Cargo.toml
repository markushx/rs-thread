[package]
name = "opentrust-cli"
description = "OpenThread-compatible CLI for the OpenTrust Thread stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["ftd", "bbr", "bbr-server", "dataset", "scan", "ping", "tables", "netdata", "srp", "srp-server", "dns", "udp", "diag", "linkmetrics", "commissioning", "scan-servers"]
# Router-capable build (router table, router thresholds, leader weight).
ftd = ["opentrust-instance/ftd", "opentrust-mle/ftd"]
# The `dataset` command group.
dataset = []
# `scan`, `scan energy`, `discover`.
scan = []
# `ping`.
ping = []
# `child`, `router`, `neighbor`, `counters`.
tables = []
# `netdata`, `prefix`, `route`.
netdata = []
# `srp client`.
srp = []
# `srp server` (the SRP server of the instance).
srp-server = ["srp", "ftd", "opentrust-instance/srp-server"]
# `dns`.
dns = []
# `udp`.
udp = []
# `networkdiagnostic`.
diag = []
# `bbr`, `dua` (Thread 1.2 Backbone Router role and Domain Unicast Address commands).
bbr = []
# The Backbone Router role commands (`bbr enable`, `bbr mgmt ...`, `fake`).
bbr-server = ["bbr", "ftd", "opentrust-instance/bbr-server"]
# `linkmetrics` (Thread 1.2 Link Metrics Initiator).
linkmetrics = []
# `commissioner`, `joiner`.
commissioning = ["ftd", "joiner", "opentrust-instance/commissioner"]
# `joiner` (also on the MTD build).
joiner = []
# Answer the Commissioner's Announce Begin, Energy Scan and PAN ID Query
# requests (also on the MTD build).
scan-servers = ["opentrust-instance/scan-servers"]
# Host binary `opentrust-cli-sim`: simulated nodes behind OT-style prompts.
sim = ["sim-mtd", "bbr-server", "opentrust-sim/ftd", "ftd", "commissioning", "srp-server"]
# The `[THCI]` commissioning trace lines of OpenThread's reference device
# build on the CLI output (read by the thread-cert scripts).
cert-log = ["dep:log", "opentrust-meshcop/cert-log"]
# Host binary `opentrust-cli-vt-mtd`: a minimal thread device (no router, no
# commissioner, no Border Agent) on the virtual-time simulation platform.
sim-mtd = ["dep:opentrust-sim", "bbr", "dataset", "scan", "ping", "tables", "netdata", "srp", "dns", "udp", "diag", "linkmetrics", "joiner", "scan-servers", "cert-log", "opentrust-instance/srp-services-12"]
defmt = ["dep:defmt", "opentrust-core/defmt"]
log = ["dep:log", "opentrust-core/log"]

[dependencies]
opentrust-core = { workspace = true }
opentrust-instance = { workspace = true }
opentrust-platform = { workspace = true }
opentrust-meshcop = { workspace = true }
opentrust-mle = { workspace = true }
opentrust-mesh = { workspace = true }
opentrust-dns = { workspace = true }
opentrust-net = { workspace = true }
rand_core = { workspace = true }
heapless = { workspace = true }
opentrust-sim = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
opentrust-sim = { workspace = true, features = ["ftd"] }

[[bin]]
name = "opentrust-cli-sim"
path = "src/bin/sim.rs"
required-features = ["sim"]

[[bin]]
name = "opentrust-cli-vt"
path = "src/bin/vt.rs"
required-features = ["sim"]

[[bin]]
name = "opentrust-cli-vt-mtd"
path = "src/bin/vt_mtd.rs"
required-features = ["sim-mtd"]

[lints]
workspace = true
