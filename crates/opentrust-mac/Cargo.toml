[package]
name = "opentrust-mac"
description = "IEEE 802.15.4 MAC layer (frames, security, CSMA-CA, CSL, link metrics) for OpenTrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
defmt = [
    "dep:defmt",
    "opentrust-core/defmt",
    "opentrust-platform/defmt",
    "heapless/defmt",
]
log = ["dep:log", "opentrust-core/log", "opentrust-platform/log"]

[dependencies]
opentrust-core = { workspace = true }
opentrust-platform = { workspace = true }
heapless = { workspace = true }
rand_core = { workspace = true }
# `select` for the async `MacDriver` (executor-agnostic, no allocation).
embassy-futures = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true
