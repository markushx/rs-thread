[package]
name = "opentrust-mle"
description = "Mesh Link Establishment (MLE): attach, roles, partitions for OpenTrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# Parent-side (router/FTD) handling of attaching children. On by default;
# end-device-only builds can use `default-features = false`.
default = ["ftd"]
ftd = []
# Thread 1.2 Link Metrics Initiator and Subject roles (MLE protocol,
# Forward Tracking Series, Enhanced-ACK probing). On by default.
link-metrics = ["opentrust-mac/link-metrics"]
# CSL receiver (SSED) and parent-side CSL scheduling. On by default.
csl = ["opentrust-mac/csl"]
# Expose the simulator and the fake environment to other crates' tests.
test-support = ["ftd", "dep:opentrust-platform"]
defmt = ["dep:defmt", "opentrust-core/defmt", "opentrust-mac/defmt", "opentrust-net/defmt", "opentrust-coap/defmt"]
log = ["dep:log", "opentrust-core/log", "opentrust-mac/log", "opentrust-net/log", "opentrust-coap/log"]

[dependencies]
opentrust-core = { workspace = true }
opentrust-mac = { workspace = true }
opentrust-net = { workspace = true }
opentrust-coap = { workspace = true }
heapless = { workspace = true }
rand_core = { workspace = true }
opentrust-platform = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
opentrust-platform = { workspace = true }

[lints]
workspace = true
