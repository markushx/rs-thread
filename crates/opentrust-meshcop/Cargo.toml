[package]
name = "opentrust-meshcop"
description = "Mesh Commissioning Protocol (MeshCoP): datasets, joiner, commissioner for OpenTrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# Leader / router side: dataset leader handlers, commissioner session state.
# The Joiner (DTLS client, Joiner Entrust) is always built; a joiner-only
# end device uses `default-features = false`.
default = ["ftd", "commissioner", "border-agent"]
ftd = ["opentrust-mle/ftd", "opentrust-mesh/ftd"]
# The Commissioner (on-mesh, and the core of an external Commissioner).
commissioner = ["ftd"]
# The Border Agent and the external Commissioner's client side.
border-agent = ["commissioner"]
# The TCAT Device's command engine (Thread 1.4.1 chapter 13, ADR 0002);
# transport- and TLS-agnostic, optional.
tcat = []
defmt = ["dep:defmt", "opentrust-core/defmt", "opentrust-coap/defmt", "opentrust-mle/defmt", "opentrust-net/defmt", "opentrust-mesh/defmt", "opentrust-dtls/defmt"]
log = ["dep:log", "opentrust-core/log", "opentrust-coap/log", "opentrust-mle/log", "opentrust-net/log", "opentrust-mesh/log", "opentrust-dtls/log"]

[dependencies]
opentrust-core = { workspace = true }
opentrust-coap = { workspace = true }
opentrust-mle = { workspace = true }
opentrust-net = { workspace = true }
opentrust-mesh = { workspace = true }
opentrust-dtls = { workspace = true }
heapless = { workspace = true }
rand_core = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
# Build and test the optional TCAT engine with the default checks.
opentrust-meshcop = { path = ".", default-features = false, features = ["tcat"] }
opentrust-mle = { workspace = true, features = ["test-support"] }
opentrust-platform = { workspace = true }

[lints]
workspace = true
