[package]
name = "opentrust-sim"
description = "Simulated 802.15.4 medium and network harness for OpenTrust (std, for tests)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["ftd"]
# Router-capable nodes with the commissioner and Border Agent compiled in.
# Without it the virtual-time node is a minimal thread device (MTD) build.
ftd = ["opentrust-instance/ftd", "opentrust-instance/commissioner", "opentrust-instance/border-agent"]
# The async test harness (`testing` module): an in-memory 802.15.4 medium,
# a lock-step virtual-time driver for `opentrust_embassy::OpenTrust::run`
# futures and a virtual `embassy-time` driver (one per test binary).
testing = [
    "dep:opentrust-embassy",
    "dep:embassy-sync",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:critical-section",
    "embassy-time-driver/tick-hz-1_000_000",
    "embassy-time-queue-utils/generic-queue-64",
    "critical-section/std",
]

[dependencies]
opentrust-core = { workspace = true }
opentrust-platform = { workspace = true }
opentrust-mac = { workspace = true }
opentrust-instance = { workspace = true }
rand_core = { workspace = true }
heapless = { workspace = true }
opentrust-embassy = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time-driver = { workspace = true, optional = true }
embassy-time-queue-utils = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true }

[dev-dependencies]
opentrust-mle = { workspace = true }
opentrust-dns = { workspace = true }
opentrust-mesh = { workspace = true, features = ["ftd"] }
opentrust-meshcop = { workspace = true, features = ["border-agent"] }
opentrust-coap = { workspace = true }
opentrust-dtls = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
sha2 = { workspace = true }

[[test]]
name = "thread_cert"
harness = false

[lints]
workspace = true
