[package]
name = "opentrust-sim"
description = "Simulated 802.15.4 medium and network harness for OpenTrust (std, for tests)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
opentrust-core = { workspace = true }
opentrust-platform = { workspace = true }
opentrust-mac = { workspace = true }
opentrust-instance = { workspace = true, features = ["ftd", "commissioner", "border-agent"] }
rand_core = { workspace = true }
heapless = { workspace = true }

[dev-dependencies]
opentrust-mle = { workspace = true }
opentrust-dns = { workspace = true }
opentrust-mesh = { workspace = true, features = ["ftd"] }
opentrust-meshcop = { workspace = true, features = ["border-agent"] }
opentrust-coap = { workspace = true }
opentrust-dtls = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
sha2 = { workspace = true }

[lints]
workspace = true
