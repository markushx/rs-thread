[package]
name = "rs-thread-sim"
description = "Simulated 802.15.4 medium and network harness for rs-thread (std, for tests)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["ftd", "srp-client", "dns-client", "csl", "ping"]
# Router-capable nodes with the commissioner and Border Agent compiled in.
# Without it the virtual-time node is a minimal thread device (MTD) build.
ftd = ["rs-thread-instance/ftd", "rs-thread-instance/bbr-server", "rs-thread-instance/commissioner", "rs-thread-instance/border-agent", "rs-thread-instance/border-router", "rs-thread-instance/scan-servers"]
# The SRP and DNS clients of the simulated instances.
srp-client = ["rs-thread-instance/srp-client"]
dns-client = ["rs-thread-instance/dns-client"]
csl = ["rs-thread-mac/csl", "rs-thread-instance/csl"]
ping = ["rs-thread-instance/ping"]
# The async test harness (`testing` module): an in-memory 802.15.4 medium,
# a lock-step virtual-time driver for `rs_thread_embassy::RsThread::run`
# futures and a virtual `embassy-time` driver (one per test binary).
testing = [
    "dep:rs-thread-embassy",
    "dep:embassy-sync",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:critical-section",
    "embassy-time-driver/tick-hz-1_000_000",
    "embassy-time-queue-utils/generic-queue-64",
    "critical-section/std",
    "rs-thread-platform/testing",
]

[dependencies]
rs-thread-core = { workspace = true }
rs-thread-platform = { workspace = true }
rs-thread-mac = { workspace = true }
rs-thread-instance = { workspace = true }
rand_core = { workspace = true }
heapless = { workspace = true }
rs-thread-embassy = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time-driver = { workspace = true, optional = true }
embassy-time-queue-utils = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true }

[dev-dependencies]
rs-thread-mle = { workspace = true }
rs-thread-dns = { workspace = true }
rs-thread-mesh = { workspace = true, features = ["ftd"] }
rs-thread-meshcop = { workspace = true, features = ["border-agent"] }
rs-thread-coap = { workspace = true }
rs-thread-dtls = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
sha2 = { workspace = true }

[[test]]
name = "thread_cert"
harness = false

[lints]
workspace = true
