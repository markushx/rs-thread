[package]
name = "rs-thread-mesh"
description = "Thread mesh routing, router IDs, child table and Network Data for OpenTrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# Router-only code: leader / router side of the TMF exchanges, routing and
# forwarding of other nodes' traffic, indirect queues for sleepy children.
default = ["ftd", "bbr", "border-router"]
ftd = ["rs-thread-mle/ftd"]
# Thread 1.2 Backbone Router client glue: Domain Unicast Address (DUA) and
# Multicast Listener Registration (MLR). An end device without a Backbone
# Router in its network can disable this to save flash and RAM.
bbr = []
# Network Data publisher: on-mesh prefix / external route publishing and
# DNS/SRP service publishing. Required by border routers and by the SRP
# server. End devices that never publish Network Data can disable this.
border-router = []
# Thread 1.2 Link Metrics.
link-metrics = ["rs-thread-mle/link-metrics", "rs-thread-mac/link-metrics"]
# Thread 1.2 Coordinated Sampled Listening.
csl = ["rs-thread-mle/csl", "rs-thread-mac/csl"]
# Thread Radio Encapsulation Link (Thread 1.3 TREL) and multi-radio selection.
trel = []
defmt = ["dep:defmt", "rs-thread-core/defmt", "rs-thread-mle/defmt", "rs-thread-net/defmt", "rs-thread-coap/defmt", "rs-thread-lowpan/defmt", "rs-thread-mac/defmt"]
log = ["dep:log", "rs-thread-core/log", "rs-thread-mle/log", "rs-thread-net/log", "rs-thread-coap/log", "rs-thread-lowpan/log", "rs-thread-mac/log"]

[dependencies]
rs-thread-core = { workspace = true }
rs-thread-mle = { workspace = true }
rs-thread-net = { workspace = true }
rs-thread-coap = { workspace = true }
rs-thread-lowpan = { workspace = true }
rs-thread-mac = { workspace = true }
heapless = { workspace = true }
rand_core = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
rs-thread-mle = { workspace = true, features = ["test-support"] }
rs-thread-platform = { workspace = true }

[lints]
workspace = true
