[package]
name = "rs-thread-net"
description = "IPv6/UDP/ICMPv6 core, MPL, address resolution, SRP/DNS-SD client for OpenTrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# IPv6 fragmentation and reassembly above 6LoWPAN (OT
# `OPENTHREAD_CONFIG_IP6_FRAGMENTATION_ENABLE`): datagrams of up to 2000 bytes.
ip6-fragmentation = []
defmt = ["dep:defmt", "rs-thread-core/defmt", "rs-thread-lowpan/defmt"]
log = ["dep:log", "rs-thread-core/log", "rs-thread-lowpan/log"]

[dependencies]
rs-thread-core = { workspace = true }
rs-thread-lowpan = { workspace = true }
rand_core = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true
