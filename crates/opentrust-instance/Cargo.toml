[package]
name = "opentrust-instance"
description = "Thread node integration layer (Instance) for OpenTrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["ftd", "bbr-server", "commissioner", "border-agent", "scan-servers"]
ftd = ["opentrust-mle/ftd", "opentrust-mesh/ftd", "opentrust-meshcop/ftd"]
# The Thread 1.2 Backbone Router role of this device (BBR service, answering
# DUA and MLR registrations).
bbr-server = ["ftd"]
commissioner = ["ftd", "opentrust-meshcop/commissioner"]
border-agent = ["commissioner", "opentrust-meshcop/border-agent"]
tcat = ["opentrust-meshcop/tcat"]
# The device side of the Commissioner's Announce Begin, Energy Scan and PAN ID
# Query requests (`/c/ab`, `/c/es`, `/c/pq`; OT `AnnounceBeginServer`,
# `EnergyScanServer`, `PanIdQueryServer`).
scan-servers = []
# The SRP server (OT `Srp::Server`): registers hosts and services of clients
# in the mesh, publishes itself in the Network Data.
srp-server = ["ftd", "opentrust-dns/srp-server"]
srp-services-8 = []
srp-services-12 = []
trel = ["opentrust-mesh/trel"]
defmt = [
    "dep:defmt",
    "opentrust-core/defmt",
    "opentrust-platform/defmt",
    "opentrust-mac/defmt",
    "opentrust-net/defmt",
    "opentrust-mle/defmt",
    "opentrust-mesh/defmt",
    "opentrust-meshcop/defmt",
    "opentrust-dns/defmt",
]
log = [
    "dep:log",
    "opentrust-core/log",
    "opentrust-platform/log",
    "opentrust-mac/log",
    "opentrust-net/log",
    "opentrust-mle/log",
    "opentrust-mesh/log",
    "opentrust-meshcop/log",
    "opentrust-dns/log",
]

[dependencies]
opentrust-core = { workspace = true, features = ["ecdsa", "ecjpake"] }
opentrust-platform = { workspace = true }
opentrust-mac = { workspace = true }
opentrust-lowpan = { workspace = true }
opentrust-net = { workspace = true }
opentrust-coap = { workspace = true }
opentrust-mle = { workspace = true }
opentrust-mesh = { workspace = true }
opentrust-meshcop = { workspace = true }
opentrust-dns = { workspace = true }
heapless = { workspace = true }
rand_core = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true
