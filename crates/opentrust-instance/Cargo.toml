[package]
name = "opentrust-instance"
description = "Thread node integration layer (Instance) for OpenTrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["ftd", "bbr-server", "commissioner", "border-agent", "scan-servers", "srp-client", "dns-client"]
ftd = ["opentrust-mle/ftd", "opentrust-mesh/ftd", "opentrust-meshcop/ftd"]
# The Thread 1.2 Backbone Router role of this device (BBR service, answering
# DUA and MLR registrations).
bbr-server = ["ftd"]
commissioner = ["ftd", "opentrust-meshcop/commissioner"]
border-agent = ["commissioner", "opentrust-meshcop/border-agent"]
tcat = ["opentrust-meshcop/tcat"]
# The device side of the Commissioner's Announce Begin, Energy Scan and PAN ID
# Query requests (`/c/ab`, `/c/es`, `/c/pq`; OT `AnnounceBeginServer`,
# `EnergyScanServer`, `PanIdQueryServer`).
scan-servers = []
# The Link Metrics Manager (OT `Utils::LinkMetricsManager`).
link-metrics-manager = []
# The History Tracker (OT `Utils::HistoryTracker`): recent network information
# and IPv6 messages sent and received. Costs RAM; off in firmware.
history-tracker = []
# IPv6 fragmentation and reassembly above 6LoWPAN (OT
# `OPENTHREAD_CONFIG_IP6_FRAGMENTATION_ENABLE`): UDP datagrams of up to 1952
# bytes. Costs RAM (reassembly slots, larger buffers); off in firmware.
ip6-fragmentation = ["opentrust-net/ip6-fragmentation"]

# The SRP client (OT `OPENTHREAD_CONFIG_SRP_CLIENT_ENABLE`): registers hosts
# and services with an SRP server, auto-starts from the Network Data. Needs
# ECDSA P-256 on the crypto backend (SIG(0) signing).
srp-client = ["opentrust-dns/srp-client", "opentrust-core/ecdsa"]
# The DNS / DNS-SD client (OT `OPENTHREAD_CONFIG_DNS_CLIENT_ENABLE`): AAAA,
# browse and service resolution.
dns-client = ["opentrust-dns/dns-client"]

# The SRP server (OT `Srp::Server`): registers hosts and services of clients
# in the mesh, publishes itself in the Network Data.
srp-server = ["ftd", "opentrust-dns/srp-server", "opentrust-core/ecdsa"]
srp-services-8 = []
srp-services-12 = []
trel = ["opentrust-mesh/trel"]
defmt = [
    "dep:defmt",
    "opentrust-core/defmt",
    "opentrust-platform/defmt",
    "opentrust-mac/defmt",
    "opentrust-net/defmt",
    "opentrust-mle/defmt",
    "opentrust-mesh/defmt",
    "opentrust-meshcop/defmt",
    "opentrust-dns/defmt",
]
log = [
    "dep:log",
    "opentrust-core/log",
    "opentrust-platform/log",
    "opentrust-mac/log",
    "opentrust-net/log",
    "opentrust-mle/log",
    "opentrust-mesh/log",
    "opentrust-meshcop/log",
    "opentrust-dns/log",
]

[dependencies]
opentrust-core = { workspace = true, features = ["ecjpake"] }
opentrust-platform = { workspace = true }
opentrust-mac = { workspace = true }
opentrust-lowpan = { workspace = true }
opentrust-net = { workspace = true }
opentrust-coap = { workspace = true }
opentrust-mle = { workspace = true }
opentrust-mesh = { workspace = true }
opentrust-meshcop = { workspace = true }
opentrust-dns = { workspace = true, default-features = false }
heapless = { workspace = true }
rand_core = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true
