[package]
name = "opentrust-embassy"
description = "Executor-agnostic async facade (embassy-sync) for the OpenTrust Thread stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
defmt = ["dep:defmt", "opentrust-core/defmt", "opentrust-platform/defmt", "opentrust-mac/defmt", "opentrust-net/defmt", "opentrust-mle/defmt", "opentrust-mesh/defmt", "opentrust-meshcop/defmt"]
log = ["dep:log", "opentrust-core/log", "opentrust-platform/log", "opentrust-mac/log", "opentrust-net/log", "opentrust-mle/log", "opentrust-mesh/log", "opentrust-meshcop/log"]

[dependencies]
opentrust-core = { workspace = true }
opentrust-platform = { workspace = true }
opentrust-mac = { workspace = true }
opentrust-net = { workspace = true }
opentrust-mle = { workspace = true }
opentrust-mesh = { workspace = true }
opentrust-meshcop = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true
