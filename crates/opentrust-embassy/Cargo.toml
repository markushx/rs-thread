[package]
name = "opentrust-embassy"
description = "Executor-agnostic async facade (embassy-sync) for the OpenTrust Thread stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["ftd", "commissioner", "border-agent", "srp-client", "dns-client"]
ftd = ["opentrust-instance/ftd"]
commissioner = ["ftd", "opentrust-instance/commissioner"]
border-agent = ["commissioner", "opentrust-instance/border-agent"]
# The SRP client and the DNS client of the instance (OT
# `OPENTHREAD_CONFIG_SRP_CLIENT_ENABLE`, `OPENTHREAD_CONFIG_DNS_CLIENT_ENABLE`).
srp-client = ["opentrust-instance/srp-client"]
dns-client = ["opentrust-instance/dns-client"]
edge-nal = ["dep:edge-nal"]
openthread-compat = ["dep:bitflags"]
defmt = ["dep:defmt", "opentrust-core/defmt", "opentrust-platform/defmt", "opentrust-mac/defmt", "opentrust-net/defmt", "opentrust-mle/defmt", "opentrust-mesh/defmt", "opentrust-meshcop/defmt", "opentrust-instance/defmt"]
log = ["dep:log", "opentrust-core/log", "opentrust-platform/log", "opentrust-mac/log", "opentrust-net/log", "opentrust-mle/log", "opentrust-mesh/log", "opentrust-meshcop/log", "opentrust-instance/log"]

[dependencies]
opentrust-core = { workspace = true }
opentrust-platform = { workspace = true }
opentrust-mac = { workspace = true }
opentrust-net = { workspace = true }
opentrust-mle = { workspace = true }
opentrust-mesh = { workspace = true }
opentrust-meshcop = { workspace = true }
opentrust-instance = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
heapless = { workspace = true }
rand_core = { workspace = true }
edge-nal = { version = "0.7", default-features = false, optional = true }
bitflags = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
# Enables the `edge-nal` feature for the tests (feature unification).
opentrust-embassy = { path = ".", features = ["edge-nal", "openthread-compat"] }
opentrust-sim = { workspace = true, features = ["testing", "ftd"] }
opentrust-dns = { workspace = true, features = ["srp-client", "dns-client"] }

[lints]
workspace = true
