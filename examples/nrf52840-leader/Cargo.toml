[package]
name = "nrf52840-leader"
description = "rs-thread leader on the nRF52840 DK (standalone firmware, not a workspace member)"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: the firmware has its own target, linker script and profile.
[workspace]

[features]
default = ["radio-nrf802154"]
# Radio backend of `rs-thread-nrf`: exactly one. `radio-nrf802154` (Nordic driver + MPSL)
# is the default; `radio-embassy` is the pure-Rust one
# (`--no-default-features --features radio-embassy`).
radio-embassy = ["rs-thread-nrf/radio-embassy", "cortex-m/critical-section-single-core"]
radio-nrf802154 = ["rs-thread-nrf/radio-nrf802154"]
# `node` binary: attach as a child and never upgrade to a router (default: router eligible).
child-only = []
# `node` binary: form the network as its Leader (it pings the realm-local all-routers
# address instead of the Leader ALOC).
leader = []

# BLE: the Board also carries the SoftDevice Controller peripherals and the
# MPSL handle (see `Board::ble`). Needs `radio-nrf802154`.
ble = ["radio-nrf802154", "dep:nrf-sdc", "dep:nrf-mpsl"]

# CLI firmware (`cli` binary): the OpenThread-compatible CLI over the DK's VCOM
# UART. `cli-all` builds every command group; pick single groups for size.
cli = ["dep:rs-thread-cli"]
cli-dataset = ["cli", "rs-thread-cli/dataset"]
cli-scan = ["cli", "rs-thread-cli/scan"]
cli-ping = ["cli", "rs-thread-cli/ping"]
cli-tables = ["cli", "rs-thread-cli/tables"]
cli-netdata = ["cli", "rs-thread-cli/netdata"]
cli-srp = ["cli", "rs-thread-cli/srp"]
cli-dns = ["cli", "rs-thread-cli/dns"]
cli-udp = ["cli", "rs-thread-cli/udp"]
cli-commissioning = ["cli", "rs-thread-cli/commissioning"]
cli-all = [
    "cli-dataset", "cli-scan", "cli-ping", "cli-tables", "cli-netdata", "cli-srp", "cli-dns",
    "cli-udp", "cli-commissioning",
]

# RCP firmware (`rcp` binary): the radio behind Spinel on the DK's VCOM UART.
rcp = ["dep:rs-thread-ncp"]

# Test aid: behave as if Button 1 were held at boot (factory reset on every start).
test-factory-reset = []

[dependencies]
rs-thread-core = { path = "../../crates/rs-thread-core", features = ["defmt", "soft-crypto", "ecdsa"] }
rs-thread-platform = { path = "../../crates/rs-thread-platform", features = ["defmt"] }
rs-thread-instance = { path = "../../crates/rs-thread-instance", default-features = false, features = ["ftd", "defmt"] }
rs-thread-embassy = { path = "../../crates/rs-thread-embassy", default-features = false, features = ["ftd", "defmt"] }
rs-thread-flash = { path = "../../crates/rs-thread-flash", features = ["defmt"] }
rs-thread-cli = { path = "../../crates/rs-thread-cli", default-features = false, features = ["ftd"], optional = true }
rs-thread-nrf = { path = "../../crates/rs-thread-nrf", default-features = false, features = ["defmt"] }
rs-thread-ncp = { path = "../../crates/rs-thread-ncp", features = ["defmt"], optional = true }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "defmt"] }
embassy-sync = "0.8"
embedded-storage-async = "0.4"
embassy-futures = "0.1"
# The critical-section implementation comes with the backend: the single-core one
# (PRIMASK) for radio-embassy, MPSL-aware one (keeps its IRQs unmasked) for radio-nrf802154.
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"
rand_core = { version = "0.10", default-features = false }
nrf-sdc = { version = "0.4", default-features = false, features = ["nrf52840", "peripheral"], optional = true }
nrf-mpsl = { version = "0.4", default-features = false, features = ["nrf52840"], optional = true }

[[bin]]
name = "cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "rcp"
path = "src/bin/rcp.rs"
required-features = ["rcp"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
