[package]
name = "nrf52840-light"
description = "Matter on-off light over OpenTrust Thread on the nRF52840 DK (RAM sizing firmware, not a workspace member)"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: the firmware has its own target, linker script and profile.
[workspace]

[features]
# BLE commissioning (Matter over BTP, `chip-tool pairing ble-thread`) with the
# Nordic SoftDevice Controller (peripheral-only library) and trouble-host,
# next to the 802.15.4 driver on MPSL. An unprovisioned light (nothing stored,
# no build-time dataset) advertises and waits for its Thread network over BLE.
# `--no-default-features` builds the Thread-only light (as before).
default = ["ble"]
ble = [
    "nrf52840-leader/ble",
    "opentrust-matter/ble-trouble",
    "dep:nrf-sdc",
    "dep:rand_core09",
]
# Test aid: factory reset on every start, as if Button 1 were held.
test-factory-reset = ["nrf52840-leader/test-factory-reset"]
# Minimal end device (not router eligible) instead of an FTD router.
med = []

[dependencies]
# Board bring-up (clocks, MPSL, radio, RNG, LED) of the leader firmware; the
# radio backend is nrf802154 (the default of that crate).
nrf52840-leader = { path = "../nrf52840-leader" }
opentrust-core = { path = "../../crates/opentrust-core", features = ["defmt"] }
opentrust-platform = { path = "../../crates/opentrust-platform", features = ["defmt"] }
opentrust-instance = { path = "../../crates/opentrust-instance", default-features = false, features = ["ftd", "defmt"] }
opentrust-embassy = { path = "../../crates/opentrust-embassy", default-features = false, features = ["ftd", "defmt"] }
opentrust-flash = { path = "../../crates/opentrust-flash", features = ["defmt"] }
opentrust-nrf = { path = "../../crates/opentrust-nrf", default-features = false, features = ["defmt"] }
opentrust-matter = { path = "../../crates/opentrust-matter", default-features = false, features = ["ftd", "defmt"] }
# The pure-Rust RustCrypto backend (p256, aes, sha2, ...); it needs `alloc`
# for a few convenience paths, so the firmware has a small heap.
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "95e41108f0a0e6ac896f0e7be3f4eecb951ed10a", default-features = false, features = ["rustcrypto", "defmt", "case-responder-only"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "defmt"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embedded-alloc = "0.6"
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"
rand_core = { version = "0.10", default-features = false }
# nrf-sdc takes its RNG as a rand_core 0.9 CryptoRng.
rand_core09 = { package = "rand_core", version = "0.9", default-features = false, optional = true }
nrf-sdc = { version = "0.4", default-features = false, features = ["nrf52840", "peripheral", "defmt"], optional = true }

# rs-matter-sc with early CASE acknowledgements (see third_party/rs-matter-sc/README.OPENTRUST.md).
[patch."https://github.com/project-chip/rs-matter"]
rs-matter-sc = { path = "../../third_party/rs-matter-sc" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
