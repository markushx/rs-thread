[workspace]
resolver = "3"
members = ["crates/*", "tools/openthread-sys", "examples/rsthread-br-posix"]
# `openthread-sys` builds OpenThread (C++) via its build script; it is the
# interop/differential-test oracle and is only built on request
# (`cargo build -p openthread-sys`).
# `examples/rsthread-br-posix` is a std-only host binary; not part of the
# embedded workspace default build.
# `examples/nrf52840-*` are standalone embedded workspaces; they are NOT
# listed here and must be built with their own Cargo.toml.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Markus Becker <markus@bec-ker.de>"]
repository = "https://gitlab.com/markushx/opentrust/"
homepage = "https://gitlab.com/markushx/opentrust/"
keywords = ["thread", "openthread", "802154", "matter", "embedded"]
categories = ["embedded", "network-programming", "no-std"]

[workspace.dependencies]
rs-thread-core = { path = "crates/rs-thread-core", version = "0.1.0" }
rs-thread-platform = { path = "crates/rs-thread-platform", version = "0.1.0" }
rs-thread-mac = { path = "crates/rs-thread-mac", version = "0.1.0" }
rs-thread-lowpan = { path = "crates/rs-thread-lowpan", version = "0.1.0" }
rs-thread-net = { path = "crates/rs-thread-net", version = "0.1.0" }
rs-thread-coap = { path = "crates/rs-thread-coap", version = "0.1.0" }
rs-thread-dtls = { path = "crates/rs-thread-dtls", version = "0.1.0" }
rs-thread-mle = { path = "crates/rs-thread-mle", version = "0.1.0", default-features = false }
rs-thread-dns = { path = "crates/rs-thread-dns", version = "0.1.0", default-features = false }
rs-thread-mesh = { path = "crates/rs-thread-mesh", version = "0.1.0", default-features = false }
rs-thread-meshcop = { path = "crates/rs-thread-meshcop", version = "0.1.0", default-features = false }
rs-thread-embassy = { path = "crates/rs-thread-embassy", version = "0.1.0" }
rs-thread-matter = { path = "crates/rs-thread-matter", version = "0.1.0" }
rs-thread-cli = { path = "crates/rs-thread-cli", version = "0.1.0" }
rs-thread-ncp = { path = "crates/rs-thread-ncp", version = "0.1.0" }
rs-thread-spinel = { path = "crates/rs-thread-spinel", version = "0.1.0" }
rs-thread-instance = { path = "crates/rs-thread-instance", version = "0.1.0", default-features = false }
rs-thread-sim = { path = "crates/rs-thread-sim", version = "0.1.0", default-features = false }
rs-thread-flash = { path = "crates/rs-thread-flash", version = "0.1.0" }

defmt = "1"
heapless = "0.9"
rand_core = { version = "0.10", default-features = false }
log = { version = "0.4", default-features = false }

# Crypto (soft-crypto backend of rs-thread-core). Versions chosen for MSRV 1.85:
# aes >= 0.9.3 and sha2 >= 0.11.1 require rustc 1.89/1.88, hence the caps.
aes = { version = ">=0.9.2, <0.9.5", default-features = false }
cmac = { version = "0.8", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = ">=0.11.0, <0.11.1", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false }
bitflags = { version = "2", default-features = false }
# `select` for the async drivers (rs-thread-mac `MacDriver`); block_on /
# poll_once in async tests.
embassy-futures = { version = "0.1.2", default-features = false }
# Async facade (rs-thread-embassy): blocking mutex, signal, waker registrations.
embassy-sync = { version = "0.8", default-features = false }
# EC-JPAKE (rs-thread-core feature `ecjpake`, ADR 0001): P-256 arithmetic.
# Same release line as rs-matter's `rustcrypto` backend (single copy).
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
# Test-only: differential testing of CCM* against the RustCrypto `ccm` crate.
ccm = { version = "0.6", default-features = false }
# rs-matter (rs-thread-matter): the `rs-matter-stack` crate of the 0.4.1
# workspace is not on crates.io yet, so the whole workspace is pinned to one
# git revision (see the rs-thread-matter crate docs). Needs Rust 1.92.
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "95e41108f0a0e6ac896f0e7be3f4eecb951ed10a", default-features = false }
# Virtual embassy-time driver of the test harness (rs-thread-sim `testing`).
embassy-time-driver = { version = "0.2", default-features = false }
embassy-time-queue-utils = { version = "0.3", default-features = false }
critical-section = "1.1"
tokio = { version = "1", features = ["fs", "net", "io-util", "rt-multi-thread", "macros", "process", "time"] }

# rs-matter-sc with early CASE acknowledgements (see third_party/rs-matter-sc/README.RSTHREAD.md).
[patch."https://github.com/project-chip/rs-matter"]
rs-matter-sc = { path = "third_party/rs-matter-sc" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
std_instead_of_core = "warn"
alloc_instead_of_core = "warn"
