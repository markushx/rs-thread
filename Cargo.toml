[workspace]
resolver = "3"
members = ["crates/*", "tools/openthread-sys"]
# `openthread-sys` builds OpenThread (C++) via its build script; it is the
# interop/differential-test oracle and is only built on request
# (`cargo build -p openthread-sys`).
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Markus Becker <markus@bec-ker.de>"]
repository = "https://gitlab.com/markushx/opentrust/"
homepage = "https://gitlab.com/markushx/opentrust/"
keywords = ["thread", "openthread", "802154", "matter", "embedded"]
categories = ["embedded", "network-programming", "no-std"]

[workspace.dependencies]
opentrust-core = { path = "crates/opentrust-core", version = "0.1.0" }
opentrust-platform = { path = "crates/opentrust-platform", version = "0.1.0" }
opentrust-mac = { path = "crates/opentrust-mac", version = "0.1.0" }
opentrust-lowpan = { path = "crates/opentrust-lowpan", version = "0.1.0" }
opentrust-net = { path = "crates/opentrust-net", version = "0.1.0" }
opentrust-coap = { path = "crates/opentrust-coap", version = "0.1.0" }
opentrust-dtls = { path = "crates/opentrust-dtls", version = "0.1.0" }
opentrust-mle = { path = "crates/opentrust-mle", version = "0.1.0", default-features = false }
opentrust-dns = { path = "crates/opentrust-dns", version = "0.1.0" }
opentrust-mesh = { path = "crates/opentrust-mesh", version = "0.1.0", default-features = false }
opentrust-meshcop = { path = "crates/opentrust-meshcop", version = "0.1.0", default-features = false }
opentrust-embassy = { path = "crates/opentrust-embassy", version = "0.1.0" }
opentrust-matter = { path = "crates/opentrust-matter", version = "0.1.0" }
opentrust-cli = { path = "crates/opentrust-cli", version = "0.1.0" }
opentrust-ncp = { path = "crates/opentrust-ncp", version = "0.1.0" }
opentrust-instance = { path = "crates/opentrust-instance", version = "0.1.0", default-features = false }
opentrust-sim = { path = "crates/opentrust-sim", version = "0.1.0" }

defmt = "1"
heapless = "0.9"
rand_core = { version = "0.10", default-features = false }
log = { version = "0.4", default-features = false }

# Crypto (soft-crypto backend of opentrust-core). Versions chosen for MSRV 1.85:
# aes >= 0.9.3 and sha2 >= 0.11.1 require rustc 1.89/1.88, hence the caps.
aes = { version = ">=0.9.2, <0.9.3", default-features = false }
cmac = { version = "0.8", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = ">=0.11.0, <0.11.1", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false }
bitflags = { version = "2", default-features = false }
# `select` for the async drivers (opentrust-mac `MacDriver`); block_on /
# poll_once in async tests.
embassy-futures = { version = "0.1.2", default-features = false }
# Async facade (opentrust-embassy): blocking mutex, signal, waker registrations.
embassy-sync = { version = "0.8", default-features = false }
# EC-JPAKE (opentrust-core feature `ecjpake`, ADR 0001): P-256 arithmetic.
# Same release line as rs-matter's `rustcrypto` backend (single copy).
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
# Test-only: differential testing of CCM* against the RustCrypto `ccm` crate.
ccm = { version = "0.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
std_instead_of_core = "warn"
alloc_instead_of_core = "warn"
