[package]
name = "rs-matter-sc"
version = "0.4.1"
edition = "2021"
description = "Native Rust implementation of the Matter (Smart-Home) ecosystem - the Secure Channel protocol: PASE, CASE, Check-In"
readme = "README.md"
license = "Apache-2.0"

[features]
default = ["std", "log"]
std = ["alloc", "rs-matter-utils/std", "rs-matter-tlv/std", "rs-matter-crypto/std", "rs-matter-cert/std", "rs-matter-pairing/std", "rs-matter-dm-core/std", "rs-matter-node-core/std", "rs-matter-transport/std"]
alloc = ["defmt?/alloc", "rs-matter-utils/alloc", "rs-matter-tlv/alloc", "rs-matter-crypto/alloc", "rs-matter-cert/alloc", "rs-matter-pairing/alloc", "rs-matter-dm-core/alloc", "rs-matter-node-core/alloc", "rs-matter-transport/alloc"]
# Multicast groups support.
groups = ["rs-matter-crypto/groups", "rs-matter-node-core/groups", "rs-matter-transport/groups"]
# CASE session resumption (Sigma2-Resume fast-path + its persisted cache).
case-resumption = ["rs-matter-transport/case-resumption"]
# Never initiate a new CASE session: `Exchange::initiate` only reuses an existing session (else fails).
case-responder-only = ["rs-matter-transport/case-responder-only"]
defmt = ["dep:defmt", "rs-matter-utils/defmt", "rs-matter-tlv/defmt", "rs-matter-crypto/defmt", "rs-matter-cert/defmt", "rs-matter-pairing/defmt", "rs-matter-dm-core/defmt", "rs-matter-node-core/defmt", "rs-matter-transport/defmt"]
log = ["dep:log", "rs-matter-utils/log", "rs-matter-tlv/log", "rs-matter-crypto/log", "rs-matter-cert/log", "rs-matter-pairing/log", "rs-matter-dm-core/log", "rs-matter-node-core/log", "rs-matter-transport/log"]

[dependencies]
rs-matter-utils = { git = "https://github.com/project-chip/rs-matter", rev = "1c2e0a9edaf99a92e0a2e104d2cf46bbdf672608", default-features = false }
rs-matter-tlv = { git = "https://github.com/project-chip/rs-matter", rev = "1c2e0a9edaf99a92e0a2e104d2cf46bbdf672608", default-features = false }
rs-matter-crypto = { git = "https://github.com/project-chip/rs-matter", rev = "1c2e0a9edaf99a92e0a2e104d2cf46bbdf672608", default-features = false }
rs-matter-cert = { git = "https://github.com/project-chip/rs-matter", rev = "1c2e0a9edaf99a92e0a2e104d2cf46bbdf672608", default-features = false }
rs-matter-dm-core = { git = "https://github.com/project-chip/rs-matter", rev = "1c2e0a9edaf99a92e0a2e104d2cf46bbdf672608", default-features = false }
rs-matter-node-core = { git = "https://github.com/project-chip/rs-matter", rev = "1c2e0a9edaf99a92e0a2e104d2cf46bbdf672608", default-features = false }
rs-matter-pairing = { git = "https://github.com/project-chip/rs-matter", rev = "1c2e0a9edaf99a92e0a2e104d2cf46bbdf672608", default-features = false }
rs-matter-transport = { git = "https://github.com/project-chip/rs-matter", rev = "1c2e0a9edaf99a92e0a2e104d2cf46bbdf672608", default-features = false }
num = { version = "0.4", default-features = false }
rand_core = { version = "0.10", default-features = false }
subtle = { version = "2.5", default-features = false }
log = { version = "0.4", optional = true }
defmt = { version = "1", features = ["ip_in_core"], optional = true }

[lints.rust]
# `cargo llvm-cov` sets these when measuring coverage (the second one only on nightly)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
