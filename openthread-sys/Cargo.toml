[package]
name = "openthread-sys"
version = "0.1.0"
authors = ["Markus Becker <markus@bec-ker.de>"]
edition = "2018"
build = "build.rs"
links = "openthread"
license = "BSD-3-Clause"
description = "Rust bindings for OpenThread"
keywords = ["openthread", "thread"]
categories = ["api-bindings", "embedded"]
# TODO: add no-std to categories, when done
homepage = "https://gitlab.com/markushx/opentrust/"
repository = "https://gitlab.com/markushx/opentrust/"
readme = "README.md"
exclude = [
    "vendor/openthread/**/*.a",
    "vendor/openthread/**/*.o",
    "vendor/openthread/autom4te.cache/*",
    "vendor/openthread/doc/*",
    "vendor/openthread/etc/*",
    "vendor/openthread/examples/*",
    "vendor/openthread/script/*",
    "vendor/openthread/tests/*",
    "vendor/openthread/third_party/jlink/*",
    "vendor/openthread/third_party/microchip/*",
    "vendor/openthread/third_party/NordicSemiconductor/*",
    "vendor/openthread/third_party/nxp/*",
    "vendor/openthread/third_party/openthread-test-driver/*",
    "vendor/openthread/third_party/Qorvo/*",
    "vendor/openthread/third_party/silabs/*",
    "vendor/openthread/third_party/ti/*",
    # ignore only certain parts of mbedtls of third_party/
    "vendor/openthread/third_party/mbedtls/repo/library/*.o",
    "vendor/openthread/third_party/mbedtls/repo/visualc",
    "vendor/openthread/third_party/mbedtls/repo/tests",
    "vendor/openthread/third_party/mbedtls/repo/programs",
    "vendor/openthread/third_party/mbedtls/repo/configs",
    "vendor/openthread/third_party/mbedtls/repo/scripts",
    "vendor/openthread/third_party/mbedtls/repo/doxygen",
    # do not ignore nlbuild-autotools of third_party/
    "vendor/openthread/tools/*",
]
[dependencies]

[build-dependencies]
bindgen = "0.53.1"

[badges]
gitlab = { repository = "https://gitlab.com/markushx/opentrust" }
maintenance = { status = "experimental" }
